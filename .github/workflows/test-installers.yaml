name: Test Actions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-installers:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
        tool: [ampel-bootstrap, ampel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.tool == 'ampel-bootstrap'
        id: bootstrap
        uses: ./install/ampel-bootstrap
      - if: matrix.tool == 'ampel'
        uses: ./install/ampel

      - if: matrix.tool == 'ampel-bootstrap'
        name: Verify bootstrap binary runs
        shell: bash
        run: ${STEPS_BOOTSTRAP_OUTPUTS_AMPEL_PATH} version
        env:
          STEPS_BOOTSTRAP_OUTPUTS_AMPEL_PATH: ${{ steps.bootstrap.outputs.ampel-path }}

      - if: matrix.tool != 'ampel-bootstrap'
        name: Verify binary runs
        shell: bash
        run: ${{ matrix.tool }} --help

  test-download-and-verify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify snappy
        uses: ./install/download-and-verify
        with:
          tool: snappy
          version: v0.2.4
          attestation-file: snappy-v0.2.4.provenance.json

      - name: Verify snappy is on PATH
        shell: bash
        run: snappy version

      # ampel v1.3.10 lives in policylabs/ampel now but was built in
      # carabiner-dev/ampel, so it downloads from the first organization and
      # its provenance only verifies against the second.
      - name: Download and verify a release built before its repository moved
        uses: ./install/download-and-verify
        with:
          tool: ampel
          version: v1.3.10
          install-dir: $HOME/org-test/moved
          attestation-file: ampel-v1.3.10.provenance.json

      # The organization list is what decides which builders are trusted:
      # the same release must be rejected when only the new one is listed.
      - name: A release built outside the listed organizations is rejected
        id: untrusted-org
        continue-on-error: true
        uses: ./install/download-and-verify
        with:
          tool: ampel
          version: v1.3.10
          install-dir: $HOME/org-test/untrusted
          attestation-file: ampel-v1.3.10.provenance.json
          orgs: policylabs

      - name: Check the untrusted release was rejected
        shell: bash
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::download-and-verify accepted a release built outside the listed organizations"
            exit 1
          fi
        env:
          OUTCOME: ${{ steps.untrusted-org.outcome }}

  test-ampel-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download bnd binary as test subject
        shell: bash
        run: |
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/bnd \
            "https://github.com/carabiner-dev/bnd/releases/download/v0.4.1/bnd-v0.4.1-linux-amd64"

      - name: Verify bnd with ampel/verify
        uses: ./ampel/verify
        with:
          subject: /tmp/bnd
          collector: https://github.com/carabiner-dev/bnd/releases/download/v0.4.1/attestations.jsonl
          policy: "git+https://github.com/carabiner-dev/policies#slsa/has-attestation.json"
          attest: "false"
